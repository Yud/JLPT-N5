# Manifest of every env var the Cloudflare Pages Function layer needs in
# production. A `${{ secrets.NAME }}` value means "read the GitHub Actions
# secret NAME" — deploy.yml's steps resolve that themselves by reading the
# same-named env var (that expression syntax only evaluates live inside
# workflow YAML, not in a plain file like this one); deploy fails fast if a
# referenced secret isn't set. Anything else is a literal, non-secret value
# applied as-is.
#
# To add a new one: add a line here, add the matching GitHub secret
# (Settings -> Secrets and variables -> Actions) if it's secret-sourced,
# AND wire `NAME: ${{ secrets.NAME }}` into the env: block of both
# deploy.yml steps that read this file (naming each secret explicitly,
# rather than dumping them all via toJSON(secrets), is what keeps zizmor's
# CI scan clean).
WANIKANI_API_KEY: ${{ secrets.WANIKANI_API_KEY }}
WANIKANI_MIN_SRS_STAGE: "6"
# Fish Audio TTS POC (functions/api/tts/fish.js).
FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
# Not a secret — a generic Japanese voice ID from Fish Audio's Voice Library.
FISH_VOICE_REFERENCE_ID: "a365c3050dd04026a81291145e017d6f"
# R2 API token (Object Read & Write, scoped to the hiragana-media bucket —
# see R2 dashboard > Manage R2 API Tokens) used by functions/api/decks/
# import.js to presign direct browser-to-R2 upload URLs.
R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
# Reuses the same secret the wrangler-action steps below already use for
# `accountId:` — not a new one, since it's the same account ID either way.
CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
